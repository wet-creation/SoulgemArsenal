plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}
mixin {
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}


minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            Random random = new Random()
            def suffix = random.nextInt(10 ** 2)
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            args '--username', 'Client' + suffix
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
}

tasks.matching { it.name == "compileKotlin" }.configureEach {
    dependsOn(tasks.named("processResources"))
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    implementation "thedarkcolour:kotlinforforge:${kotlin_forge}"
    implementation group: "thedarkcolour", name: "kfflang", version: kotlin_forge
    implementation group: "thedarkcolour", name: "kfflib", version: kotlin_forge
    implementation group: "thedarkcolour", name: "kffmod", version: kotlin_forge
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
    it.kotlin.destinationDirectory = dir
}

afterEvaluate {
    // 1. Находим и кастрируем addMixinsToJar
    tasks.matching { it.name == "addMixinsToJar" }.configureEach { t ->
        // полностью отключаем
        t.enabled = false
        // убираем все зависимости, чтобы не было кругов
        t.setDependsOn([])
    }

    // 2. Убираем любые зависимости jar от addMixinsToJar (если плагин их навесил)
    tasks.matching { it.name == "jar" }.configureEach { jarTask ->
        // удаляем зависимости типа dependsOn(addMixinsToJar)
        jarTask.dependsOn.removeIf { dep ->
            dep instanceof Task && dep.name == "addMixinsToJar"
        }

    }

    // 3. Аналогично можно подчистить test-задачи, если плагин завязал их на addMixinsToJar
    tasks.matching { it.name in ["compileTestJava", "compileTestKotlin", "test"] }.configureEach { testTask ->
        testTask.dependsOn.removeIf { dep ->
            dep instanceof Task && dep.name == "addMixinsToJar"
        }
    }
}

